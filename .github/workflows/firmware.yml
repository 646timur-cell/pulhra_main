# SPDX-License-Identifier: GPL-3.0-only
name: firmware

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve channel and validate release tag
        id: meta
        run: python3 tools/release_channel.py
      - name: Python packages
        run: python3 -m pip install pillow fonttools
      - name: Release channel tests
        run: python3 -m unittest discover -s tests -p 'release_test.py' -v
      - name: Generated headers
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Host tests (PULHRA)
        run: |
          mkdir -p build/host
          cc -O2 -w -DFELUCCA_SWAMP=1 -DFELUCCA_MONOFM=1 -DFELUCCA_MODULE=0 -Ibuild/gen -Ifirmware/src -o build/host/pulhra_test tests/pulhra_test.c -lm
          build/host/pulhra_test
      - name: PULHRA USB transport and timing tests
        run: |
          python3 -m unittest discover -s tests -p uac_recording_test.py -v
          cc -O2 -Wall -Wextra -o build/host/pulhra_timer_test tests/pulhra_timer_test.c
          build/host/pulhra_timer_test
          cc -O2 -w -DT_CDC=0 -DHALF_FRAMES=128 -DFELUCCA_UAC_FAST_POLL=1 -o build/host/uac_test tests/uac_test.c -lm
          build/host/uac_test
          for rate in 44100 48000; do
            flags=()
            if [ "$rate" = 48000 ]; then flags=(-DTEST_RATE48=1); fi
            cc -O2 -w -DT_CDC=0 -DHALF_FRAMES=128 -DFELUCCA_UAC_FAST_POLL=1 "${flags[@]}" -o build/host/uac_jitter_test tests/uac_jitter_test.c -lm
            build/host/uac_jitter_test
          done
          for channels in 2 6; do
            cc -O2 -w -DFELUCCA_UAC_NCH=$channels -DFELUCCA_UAC_OUT=1 -o build/host/uac_service_test tests/uac_service_test.c -lm
            build/host/uac_service_test
          done
      - name: JieLi toolchain
        run: tools/get_toolchain.sh
      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
      - name: Build default firmware and preserve its release bundle
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -o pipefail
          FELUCCA_SWAMP=1 FELUCCA_MONOFM=1 FELUCCA_MODULE=0 ./build.sh --release "$VERSION" 2>&1 | tee build-pulhra.log
          cp -R "build/release-$VERSION" build/default-release
      - name: Build experimental stems and diagnostic firmware
        if: steps.meta.outputs.channel != 'stable'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -o pipefail
          FELUCCA_SWAMP=1 FELUCCA_MONOFM=1 FELUCCA_MODULE=0 FELUCCA_UAC_TONE=1 ./build.sh --release "$VERSION" 2>&1 | tee build-stereo-tone.log
          cp "build/pulhra-$VERSION.fwsc" "build/pulhra-$VERSION-stereo-tone.fwsc"
          FELUCCA_SWAMP=1 FELUCCA_MONOFM=1 FELUCCA_MODULE=0 FELUCCA_UAC_NCH=6 ./build.sh --release "$VERSION" 2>&1 | tee build-stems.log
          cp "build/pulhra-$VERSION.fwsc" "build/pulhra-$VERSION-stems.fwsc"
          FELUCCA_SWAMP=1 FELUCCA_MONOFM=1 FELUCCA_MODULE=0 FELUCCA_UAC_NCH=6 FELUCCA_UAC_TONE=1 ./build.sh --release "$VERSION" 2>&1 | tee build-stems-tone.log
          cp "build/pulhra-$VERSION.fwsc" "build/pulhra-$VERSION-stems-tone.fwsc"
      - name: Assemble site from default firmware and matching release bundle
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cp "build/default-release/pulhra-$VERSION.fwsc" "build/pulhra-$VERSION.fwsc"
          rm -rf "build/release-$VERSION"
          mv build/default-release "build/release-$VERSION"
          python3 tools/prepare_release.py
          tar -czf "build/pulhra-$VERSION-release.tar.gz" -C "build/release-$VERSION" .
      - name: Upload firmware, installers, source identity and licences
        uses: actions/upload-artifact@v4
        with:
          name: pulhra-${{ steps.meta.outputs.channel }}-${{ github.sha }}
          path: |
            build/site/
            build/*-release.tar.gz
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build*.log
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (needs.build.outputs.channel == 'stable' || needs.build.outputs.channel == 'preview' || needs.build.outputs.channel == 'rc')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Both channels share one Pages branch: serialize read/modify/push, never force-push.
    concurrency:
      group: pulhra-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pulhra-${{ needs.build.outputs.channel }}-${{ github.sha }}
          path: output
      - uses: actions/checkout@v4
        if: needs.build.outputs.channel != 'rc'
        with:
          ref: firmware-builds
          path: published
      - name: Stage only the selected Pages channel
        id: stage
        if: needs.build.outputs.channel != 'rc'
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          if [ "$CHANNEL" = preview ]; then
            head=$(git ls-remote origin refs/heads/develop | cut -f1)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "A newer develop commit exists; skipping this preview."
              exit 0
            fi
          fi
          python3 tools/publish_site.py output/site published
          echo "staged=yes" >> "$GITHUB_OUTPUT"
      - name: Publish tagged release (immutable assets)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          flags=(--latest)
          if [ "$CHANNEL" = rc ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag "${flags[@]}" --title "PULHRA $VERSION" \
            --generate-notes "output/pulhra-$VERSION-release.tar.gz" \
            output/site/*.fwsc output/site/fm1-pulhra-installer.html output/site/pulhra-editor.html \
            output/site/SHA256SUMS output/site/SOURCE_COMMIT output/site/CHANNEL.json
      - name: Push staged Pages channel
        if: steps.stage.outputs.staged == 'yes'
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish $CHANNEL from $GITHUB_SHA"
          git push origin HEAD:firmware-builds
