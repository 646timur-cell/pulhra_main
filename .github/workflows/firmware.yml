# SWAMP MACHINE (firmware/src/swamp.c on the MONOFM sound core): host tests, then the firmware package (.fwsc) with
# JieLi's toolchain and the AC79 SDK, uploaded as the artifact "felucca-swamp" and published with its web installer to
# the firmware-builds branch.
name: firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python3 -m pip install pillow fonttools

      - name: Generated headers
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"

      - name: Host tests (MONOFM)
        run: |
          mkdir -p build/host
          cc -O2 -w -DFELUCCA_MONOFM=1 -DFELUCCA_MODULE=0 -Ibuild/gen -Ifirmware/src -o build/host/monofm_test tests/monofm_test.c -lm
          build/host/monofm_test | tail -n 30

      - name: Host tests (SWAMP)
        run: |
          cc -O2 -w -DFELUCCA_SWAMP=1 -DFELUCCA_MONOFM=1 -DFELUCCA_MODULE=0 -Ibuild/gen -Ifirmware/src -o build/host/swamp_test tests/swamp_test.c -lm
          build/host/swamp_test

      - name: JieLi toolchain
        run: tools/get_toolchain.sh

      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK

      - name: Build (SWAMP)
        run: |
          set -o pipefail
          FELUCCA_SWAMP=1 FELUCCA_MONOFM=1 FELUCCA_MODULE=0 ./build.sh --release 1.5.1-swamp 2>&1 | tee build-swamp.log

      - name: "Build logs to the ci-logs branch (on a failure, for a clone without the Actions UI)"
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build-swamp.log /tmp/logs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs && git rm -rfq . && git clean -fdxq
          cp /tmp/logs/* . 2>/dev/null || echo "no log" > none.txt
          git add -A && git commit -qm "Build logs of ${GITHUB_SHA}" && git push -f origin ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: felucca-swamp
          path: |
            build/felucca-1.5.1-swamp.fwsc
            build/release-1.5.1-swamp/
            build-swamp.log

      - name: Publish to the firmware-builds branch (the package, its checksum and the build log)
        if: github.ref == 'refs/heads/main'
        run: |
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out && cp build/felucca-1.5.1-swamp.fwsc build-swamp.log /tmp/out/
          python3 web/make_module_installer.py build/felucca-1.5.1-swamp.fwsc 1.5.1-swamp /tmp/out/fm1-swamp-installer.html
          (cd /tmp/out && sha256sum felucca-1.5.1-swamp.fwsc > SHA256SUMS && echo "$sha" > SOURCE_COMMIT)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan firmware-builds
          git rm -rfq . && git clean -fdxq
          cp /tmp/out/* .
          git add -A && git commit -qm "Firmware build of $sha"
          git push -f origin firmware-builds

      - name: Release (tags v*; the package and its installer page)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 web/make_module_installer.py build/felucca-1.5.1-swamp.fwsc 1.5.1-swamp build/fm1-swamp-installer.html
          set -- build/felucca-1.5.1-swamp.fwsc build/fm1-swamp-installer.html
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$@" --title "$GITHUB_REF_NAME" --notes "SWAMP MACHINE for the M-VAVE FM-1. Install by opening fm1-swamp-installer.html in Chrome with the FM-1 on USB."
          fi
