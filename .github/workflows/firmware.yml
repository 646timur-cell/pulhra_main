# Sound-module build, the STRANGE build (STRANGE.md), the MONOFM build and SWAMP MACHINE (firmware/src/swamp.c, its own
# entry on the MONOFM sound core): host tests, then the firmware packages (.fwsc) with JieLi's toolchain and the AC79
# SDK. The packages are uploaded as the run's artifacts "felucca-module", "felucca-strange", "felucca-monofm" and
# "felucca-swamp";
# install one with the web installer's "install a file" option (or tools/fm1_install.py). A tag v* also attaches both
# to a GitHub release.
name: firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python3 -m pip install pillow fonttools

      - name: Generated headers
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"

      - name: Host tests (sound module, and Felucca's UI with FELUCCA_MODULE=0)
        run: |
          mkdir -p build/host
          cc -O1 -w -Ibuild/gen -Ifirmware/src -o build/host/module_test tests/module_test.c -lm
          build/host/module_test | tail -n 60
          cc -O1 -w -DFELUCCA_MODULE=0 -Ibuild/gen -Ifirmware/src -o build/host/ui_test tests/ui_test.c -lm
          build/host/ui_test | tail -n 3
          for t in midi_control_test chord_test project_test; do
            cc -O1 -w -DFELUCCA_MODULE=0 -Ibuild/gen -Ifirmware/src -o build/host/$t tests/$t.c -lm
            build/host/$t | tail -n 1
          done

      - name: Host tests (STRANGE)
        run: |
          cc -O2 -w -DFELUCCA_STRANGE=1 -Ibuild/gen -Ifirmware/src -o build/host/strange_test tests/strange_test.c -lm
          build/host/strange_test | tail -n 60

      - name: Host tests (MONOFM)
        run: |
          cc -O2 -w -DFELUCCA_MONOFM=1 -DFELUCCA_MODULE=0 -Ibuild/gen -Ifirmware/src -o build/host/monofm_test tests/monofm_test.c -lm
          build/host/monofm_test | tail -n 30

      - name: Host tests (SWAMP)
        run: |
          cc -O2 -w -DFELUCCA_SWAMP=1 -DFELUCCA_MONOFM=1 -DFELUCCA_MODULE=0 -Ibuild/gen -Ifirmware/src -o build/host/swamp_test tests/swamp_test.c -lm
          build/host/swamp_test

      - name: JieLi toolchain
        run: tools/get_toolchain.sh

      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK

      - name: Build
        run: |
          set -o pipefail
          ./build.sh --release 1.5.1-mod 2>&1 | tee build.log
          mkdir -p /tmp/mod && cp -r build/felucca-1.5.1-mod.fwsc build/release-1.5.1-mod /tmp/mod/

      - name: Build (STRANGE)
        run: |
          set -o pipefail
          FELUCCA_STRANGE=1 ./build.sh --release 1.5.1-strange 2>&1 | tee build-strange.log
          mkdir -p /tmp/strange && cp -r build/felucca-1.5.1-strange.fwsc build/release-1.5.1-strange /tmp/strange/

      - name: Build (MONOFM)
        run: |
          set -o pipefail
          FELUCCA_MONOFM=1 FELUCCA_MODULE=0 ./build.sh --release 1.5.1-monofm 2>&1 | tee build-monofm.log
          mkdir -p /tmp/monofm && cp -r build/felucca-1.5.1-monofm.fwsc build/release-1.5.1-monofm /tmp/monofm/

      - name: Build (SWAMP)
        run: |
          set -o pipefail
          FELUCCA_SWAMP=1 FELUCCA_MONOFM=1 FELUCCA_MODULE=0 ./build.sh --release 1.5.1-swamp 2>&1 | tee build-swamp.log
          cp -r /tmp/mod/felucca-1.5.1-mod.fwsc /tmp/mod/release-1.5.1-mod /tmp/strange/* /tmp/monofm/* build/

      - name: "Build logs to the ci-logs branch (on a failure, for a clone without the Actions UI)"
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log build-strange.log build-monofm.log build-swamp.log /tmp/logs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs && git rm -rfq . && git clean -fdxq
          cp /tmp/logs/* . 2>/dev/null || echo "no log" > none.txt
          git add -A && git commit -qm "Build logs of ${GITHUB_SHA}" && git push -f origin ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: felucca-module
          path: |
            build/felucca-1.5.1-mod.fwsc
            build/release-1.5.1-mod/

      - uses: actions/upload-artifact@v4
        with:
          name: felucca-strange
          path: |
            build/felucca-1.5.1-strange.fwsc
            build/release-1.5.1-strange/
            build-strange.log

      - uses: actions/upload-artifact@v4
        with:
          name: felucca-monofm
          path: |
            build/felucca-1.5.1-monofm.fwsc
            build/release-1.5.1-monofm/
            build-monofm.log

      - uses: actions/upload-artifact@v4
        with:
          name: felucca-swamp
          path: |
            build/felucca-1.5.1-swamp.fwsc
            build/release-1.5.1-swamp/
            build-swamp.log

      - name: Publish to the firmware-builds branch (the package, its checksum and the build log)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/monofm' || github.ref == 'refs/heads/swamp'
        run: |
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out && cp build/felucca-1.5.1-mod.fwsc build/felucca-1.5.1-strange.fwsc build/felucca-1.5.1-monofm.fwsc build/felucca-1.5.1-swamp.fwsc build.log build-strange.log build-monofm.log build-swamp.log /tmp/out/
          python3 web/make_module_installer.py build/felucca-1.5.1-mod.fwsc 1.5.1-mod /tmp/out/fm1-sound-module-installer.html
          python3 web/make_module_installer.py build/felucca-1.5.1-strange.fwsc 1.5.1-strange /tmp/out/fm1-strange-installer.html
          python3 web/make_module_installer.py build/felucca-1.5.1-monofm.fwsc 1.5.1-monofm /tmp/out/fm1-monofm-installer.html
          python3 web/make_module_installer.py build/felucca-1.5.1-swamp.fwsc 1.5.1-swamp /tmp/out/fm1-swamp-installer.html
          (cd /tmp/out && sha256sum felucca-1.5.1-mod.fwsc felucca-1.5.1-strange.fwsc felucca-1.5.1-monofm.fwsc felucca-1.5.1-swamp.fwsc > SHA256SUMS && echo "$sha" > SOURCE_COMMIT)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan firmware-builds
          git rm -rfq . && git clean -fdxq
          cp /tmp/out/* .
          git add -A && git commit -qm "Firmware build of $sha"
          git push -f origin firmware-builds

      - name: Release (tags v*; the packages and both installer pages, added to a release made on GitHub first)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 web/make_module_installer.py build/felucca-1.5.1-mod.fwsc 1.5.1-mod build/fm1-sound-module-installer.html
          python3 web/make_module_installer.py build/felucca-1.5.1-strange.fwsc 1.5.1-strange build/fm1-strange-installer.html
          set -- build/felucca-1.5.1-strange.fwsc build/fm1-strange-installer.html build/felucca-1.5.1-mod.fwsc build/fm1-sound-module-installer.html
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$@" --title "$GITHUB_REF_NAME" --notes "STRANGE (darkmachine, a texture module on Felucca 1.5.1; STRANGE.md) and the sound-module build. Install by opening fm1-strange-installer.html in Chrome with the FM-1 on USB."
          fi